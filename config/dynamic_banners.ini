; SCS Dynamic Banners-N-Flags
; Shows oversize banners and flags on your own truck and attached trailers only while the beacons are on.
; This file is optional: delete it to go back to the defaults.

[General]
Enabled = 1
; 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Trace
LogLevel = 3
; 0 = shown while beacons are ON, hidden while OFF. 1 = the opposite.
InvertBeacon = 0
; 1 = show everything while the game is paused (menus, service shop, loading)
ShowWhilePaused = 0
; 1 = also toggle banners/flags on trailers attached to your truck
AffectTrailers = 1
; 1 = hide flag cloth with a small draw hook (recommended). 0 = no code hooks at all, but flag cloth
;     then has to be shown while the game is paused.
UseClothHook = 1

[Targets]
; Accessory slot names (the last part of an accessory's unit name, e.g. oversize.scs.lowboy.r_banner)
Slots = f_banner, flag_f_l, flag_f_r, r_banner, flag_r_l, flag_r_r
